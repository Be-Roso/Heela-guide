<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>힐라 공략집</title>
    <!-- 웹폰트 설정 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 기본: 다크 모드 색상 */
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --header-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-title: linear-gradient(135deg, #fef08a 0%, #f59e0b 100%);
            --accent-blue: #38bdf8;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        /* 라이트 모드 색상 설정 */
        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --card-hover: #e2e8f0;
            --header-bg: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            --border-color: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-title: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            --accent-blue: #0284c7;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 24px 16px 80px 16px; /* 아래쪽 버튼 여백 확보 */
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* 오른쪽 아래 고정 다크/라이트 모드 전환 플로팅 버튼 */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* 타이틀 영역 (정중앙 정렬) */
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px 16px;
            background: var(--header-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center; /* 중앙 정렬 */
            gap: 12px;
            transition: background 0.3s ease;
        }

        /* 강아지 이미지 프로필 스타일 */
        .header-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f59e0b;
        }

        .header h1 { 
            margin: 0; 
            font-size: 24px; 
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--text-title);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 그리드 및 카드 버튼 스타일 */
        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }
        
        .btn { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            padding: 18px 12px; 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px;
            color: var(--text-main); 
            text-decoration: none; 
            font-size: 16px; 
            font-weight: 700;
            cursor: pointer; 
            min-height: 75px; 
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .btn:hover { 
            background-color: var(--card-hover); 
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon { font-size: 22px; margin-bottom: 4px; }
        .btn-badge {
            font-size: 11px;
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* 뒤로가기 버튼 */
        .btn-back { 
            grid-column: span 2; 
            background: var(--card-bg);
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            min-height: 50px;
            flex-direction: row;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- 강아지 이미지 -->
            <img src="dog.png" alt="강아지" class="header-img">
            <h1>힐라 공략집</h1>
        </div>
        
        <!-- 메뉴 그리드 -->
        <div id="menu-container" class="grid-container"></div>
    </div>

    <!-- 오른쪽 아래 고정 테마 전환 버튼 -->
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🎨 테마 변경 (🌙 다크)</button>

    <script>
        // 메뉴 데이터
        const menuData = {
            "헌터": {
                icon: "🧝‍♂️",
                items: {
                    "헌터의 등급": "헌터의_등급.html",
                    "헌터 각성석": "헌터_각성석.html",
                    "헌터 전직": {
                        "레인져": "헌터_전직_레인져.html",
                        "소서러": "헌터_전직_소서러.html",
                        "팔라딘": "헌터_전직_팔라딘.html",
                        "버서커": "헌터_전직_버서커.html",
                        "다크나이트": "헌터_전직_다크나이트.html"
                    },
                    "4차 스킬트리": {
                        "레인져": "4차_스킬트리_레인져.html",
                        "소서러": "4차_스킬트리_소서러.html",
                        "팔라딘": "4차_스킬트리_팔라딘.html",
                        "버서커": "4차_스킬트리_버서커.html",
                        "다크나이트": "4차_스킬트리_다크나이트.html"
                    },
                    "목장": {
                        "라이딩펫": "목장_라이딩펫.html",
                        "라이딩장비": "목장_라이딩장비.html"
                    }
                }
            },
            "등반": {
                icon: "🏔️",
                items: {
                    "카부": {
                        "카부 헌터": "카부_헌터.html",
                        "카부 장비": "카부_장비.html",
                        "카부 공략": "카부_공략.html"
                    },
                    "어부": {
                        "어부 헌터": "어부_헌터.html",
                        "어부 장비": "어부_장비.html",
                        "어부 공략": "어부_공략.html"
                    }
                }
            },
            "장비": {
                icon: "⚔️",
                items: {
                    "유효옵션": "유효옵션.html",
                    "프리셋": "프리셋.html",
                    "옵션&품질작": "옵션and품질작.html",
                    "템트": "템트.html",
                    "유니크": "유니크.html",
                    "룬": "룬.html",
                    "도감작": "도감작.html"
                }
            },
            "컨텐츠": {
                icon: "🎮",
                items: {
                    "지하던전": "지하던전.html",
                    "콜로세움": {
                        "엘리트": "콜로세움_엘리트.html",
                        "챌린저스": "콜로세움_챌린저스.html"
                    },
                    "월드보스": {
                        "헌터조합": "월드보스_헌터조합.html",
                        "패턴공략": "월드보스_패턴공략.html"
                    },
                    "마왕성": {
                        "앞뜰": "마왕성_앞뜰.html",
                        "어금니": "마왕성_어금니.html",
                        "사랑니": "마왕성_사랑니.html"
                    },
                    "승전": "승전.html",
                    "타락한목장": {
                        "일반스테이지": "타락한목장_일반스테이지.html",
                        "보스스테이지(스턴O)": "타락한목장_보스스테이지_스턴O.html",
                        "보스스테이지(스턴X)": "타락한목장_보스스테이지_스턴X.html"
                    },
                    "담금질": "담금질.html"
                }
            }
        };

        const container = document.getElementById('menu-container');
        let historyStack = [];

        // 다크 / 라이트 모드 전환 로직
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-btn');
            
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');

            if (isLight) {
                themeBtn.innerHTML = '🎨 테마 변경 (☀️ 라이트)';
                localStorage.setItem('theme', 'light');
            } else {
                themeBtn.innerHTML = '🎨 테마 변경 (🌙 다크)';
                localStorage.setItem('theme', 'dark');
            }
        }

        // 브라우저 저장 테마 불러오기
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('theme-btn').innerHTML = '🎨 테마 변경 (☀️ 라이트)';
        }

        // 메뉴 렌더링 함수
        function renderMenu(currentMenu) {
            container.innerHTML = '';

            if (historyStack.length > 0) {
                const backBtn = document.createElement('button');
                backBtn.className = 'btn btn-back';
                backBtn.innerHTML = '<span>⬅️</span> <span>이전으로 돌아가기</span>';
                backBtn.onclick = () => {
                    const previousMenu = historyStack.pop();
                    renderMenu(previousMenu);
                };
                container.appendChild(backBtn);
            }

            for (const key in currentMenu) {
                const node = currentMenu[key];
                const isRootNode = node && typeof node === 'object' && node.icon && node.items;
                const icon = isRootNode ? node.icon : null;
                const target = isRootNode ? node.items : node;

                if (typeof target === 'string') {
                    const link = document.createElement('a');
                    link.className = 'btn';
                    link.innerText = key;
                    link.href = target;
                    container.appendChild(link);
                } else {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    
                    let htmlContent = '';
                    if (icon) htmlContent += `<span class="btn-icon">${icon}</span>`;
                    htmlContent += `<span>${key}</span>`;
                    
                    if (!isRootNode) {
                        htmlContent += `<span class="btn-badge">하위 메뉴</span>`;
                    }

                    btn.innerHTML = htmlContent;
                    btn.onclick = () => {
                        historyStack.push(currentMenu);
                        renderMenu(target);
                    };
                    container.appendChild(btn);
                }
            }
        }

        renderMenu(menuData);
    </script>
</body>
</html>
